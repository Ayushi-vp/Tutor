# Linux server: copy prep-console/ over, create .env (see .env.example), then
#   docker compose up -d --build
# The app listens on 127.0.0.1:5000 of the host. Put HTTPS in front of it with either
#   - Tailscale Funnel on the host:  tailscale funnel --bg 5000
#   - the bundled Caddy (own domain): set DOMAIN in .env, then  docker compose --profile caddy up -d
# Back up the database:  docker compose exec app python backend/backup.py   (lands in the volume's backups/)

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PREP_DB: /data/prep.db
      BACKUP_DIR: /data/backups
      DEV_LOGIN: "0"
    volumes:
      - prep-data:/data
    ports:
      - "127.0.0.1:5000:5000"

  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  prep-data:
  caddy-data:
