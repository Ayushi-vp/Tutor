<style>
/* ---- flow diagrams ---- */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:14px 0;padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r)}
.fnode{flex:1 1 118px;min-width:0;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.fn-t{font-family:var(--cond);font-weight:700;font-size:13px;color:var(--ink);line-height:1.2}
.fn-d{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.35}
.farrow{display:flex;align-items:center;color:var(--muted);font-size:14px;flex:none}
@media (max-width:560px){.farrow{display:none}.fnode{flex:1 1 100%}}

/* ---- overview specifics ---- */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}

.nextlist{display:flex;flex-direction:column;gap:0}
.nextrow{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.nextrow:first-child{border-top:0;padding-top:2px}
.nextrow .nx{font-family:var(--mono);font-size:10px;color:var(--muted);padding-top:3px;white-space:nowrap}
.nextrow b{font-weight:600;font-size:13.5px;display:block;line-height:1.35}
.nextrow small{color:var(--muted);font-size:12px}
.nextrow .go{margin-left:auto;flex:none;padding:3px 9px;border:1px solid var(--line-2);border-radius:5px;background:var(--surface);cursor:pointer;font-size:11.5px;font-weight:500}
.nextrow .go:hover{border-color:var(--accent);color:var(--accent)}

/* ---- roadmap ---- */
.week{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:10px;overflow:hidden}
.week-h{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.week-n{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-wash);border:1px solid var(--accent-edge);padding:2px 8px;border-radius:100px;flex:none}
.week-t{font-family:var(--cond);font-weight:700;font-size:15.5px;line-height:1.2}
.week-f{font-size:12.5px;color:var(--muted);display:block;font-family:var(--sans);font-weight:400}
.week-p{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.check{display:flex;align-items:flex-start;gap:10px;padding:9px 15px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;cursor:pointer;text-align:left;font-size:13.5px;color:var(--ink-2)}
.check:last-child{border-bottom:0}
.check:hover{background:var(--surface-2)}
.check .box{width:16px;height:16px;flex:none;border:1.5px solid var(--line-2);border-radius:4px;margin-top:2px;display:grid;place-items:center;font-size:10px;color:transparent}
.check[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.check[aria-pressed="true"] span.lbl{text-decoration:line-through;color:var(--muted)}

/* ---- flashcards ---- */
.fcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:26px 22px;min-height:230px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.fcard .fq{font-family:var(--cond);font-weight:700;font-size:20px;line-height:1.25}
.fcard .fa{font-size:14.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:14px}
.fcard .fmeta{display:flex;gap:8px;align-items:center}
.fcontrols{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.deck-bar{display:flex;gap:3px;margin:14px 0 0}
.deck-bar i{height:4px;flex:1;background:var(--surface-3);border-radius:2px}
.deck-bar i.on{background:var(--accent)}
.deck-bar i.ok{background:var(--good)}

/* ---- mock interview ---- */
.timer{font-family:var(--mono);font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.timer.low{color:var(--crit)}
.qcard{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:0 var(--r) var(--r) 0;background:var(--surface);padding:13px 15px;margin-bottom:9px}
.qcard .qq{font-weight:600;font-size:14.5px;margin-bottom:5px;line-height:1.4}
.qcard .qa{font-size:13.5px;color:var(--ink-2);border-top:1px dashed var(--line-2);padding-top:8px;margin-top:8px}
textarea.notes{width:100%;min-height:120px;padding:11px 13px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);font-family:var(--sans);font-size:13.5px;resize:vertical;line-height:1.55}

/* ---- 60-minute clock strip ---- */
.clock{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 20px;padding:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r)}
.ck{flex:1 1 80px;min-width:0;background:var(--surface);border:1px solid var(--line-2);border-top:2px solid var(--s4);border-radius:0 0 var(--r-sm) var(--r-sm);padding:6px 8px;display:flex;flex-direction:column;gap:1px}
.ck-m{font-family:var(--mono);font-size:10px;color:var(--accent-ink);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ck-t{font-family:var(--cond);font-weight:700;font-size:12px;color:var(--ink);line-height:1.2}
@media (max-width:640px){.ck{flex:1 1 calc(33.333% - 4px)}}

/* ---- beginner primer / senior layer on a design ---- */
.primer{margin:0 0 20px;border:1px solid var(--accent-edge);border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;background:var(--accent-wash);padding:4px 18px 14px}
.primer::before{content:"Start here 4 build the ground floor first";display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin:14px 0 2px}
.primer .prose > h4:first-of-type{margin-top:6px}
.primer .prose{color:var(--ink-2)}
.deep{margin:22px 0 0;border-top:1px solid var(--line);padding-top:4px}
.deep::before{content:"Going deeper 4 the senior layer";display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn-ink);margin:12px 0 2px}
.deep .prose > h4:first-of-type{margin-top:6px}
@media (max-width:560px){.primer{padding:4px 13px 12px}}

/* ---- worked exercise ---- */
.drill{margin:16px 0 4px;max-width:68ch;border:1px solid var(--line-2);border-left:2px solid var(--s4);border-radius:0 var(--r) var(--r) 0;background:var(--surface-2);padding:13px 15px;font-size:14px;color:var(--ink-2)}
.drill > b:first-child{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn-ink);display:block;margin-bottom:6px}
.drill p{margin:0 0 8px}
.drill p:last-child{margin-bottom:0}
.drill ul{margin:0 0 8px;padding-left:18px}
.drill li{margin-bottom:4px}
.drill strong{color:var(--ink);font-weight:600}
.drill code{font-family:var(--mono);font-size:.87em;background:var(--surface-3);padding:1px 5px;border-radius:4px;color:var(--ink)}
.drill table{width:auto;margin:8px 0 10px;font-variant-numeric:tabular-nums}
.drill th,.drill td{background:none;padding:3px 16px 3px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.drill th{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.drill tbody tr:hover{background:none}
.drill details{margin-top:11px;border-top:1px solid var(--line);padding-top:10px}
.drill summary{cursor:pointer;font-weight:600;color:var(--accent-ink);font-size:13px;list-style:none;display:flex;align-items:center;gap:6px}
.drill summary::-webkit-details-marker{display:none}
.drill summary::before{content:"▸";font-size:11px;display:inline-block;transition:transform .15s ease}
.drill details[open] summary::before{transform:rotate(90deg)}
.drill details[open] summary{margin-bottom:9px}

/* ---- external reading list ---- */
.refs{margin:18px 0 4px;max-width:68ch}
.refs-h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.refs-h::after{content:"";flex:1;height:1px;background:var(--line)}
.ref{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);margin-bottom:6px;text-decoration:none;color:inherit}
.ref:hover{border-color:var(--accent);background:var(--surface-2)}
.ref-k{flex:none;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-top:2px;min-width:48px;text-align:center}
.k-paper{background:var(--accent-wash);color:var(--accent-ink)}
.k-video{background:var(--crit-wash);color:var(--crit-ink)}
.k-post{background:var(--good-wash);color:var(--good-ink)}
.k-docs{background:var(--warn-wash);color:var(--warn-ink)}
.k-code,.k-tool{background:var(--surface-3);color:var(--ink-2)}
.ref-b{min-width:0;flex:1}
.ref-b b{display:block;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.32}
.ref-b small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px;line-height:1.42}
.ref-h{flex:none;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap}
@media (max-width:560px){.ref-h{display:none}.ref-k{min-width:0}}

/* ---- quick checks ---- */
.checks{margin:18px 0 4px;max-width:68ch}
.checks-h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.checks-h::after{content:"";flex:1;height:1px;background:var(--line)}
.qcheck{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);margin-bottom:6px;overflow:hidden}
.qcheck summary{cursor:pointer;list-style:none;display:flex;align-items:flex-start;gap:9px;padding:9px 11px;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.38}
.qcheck summary::-webkit-details-marker{display:none}
.qcheck summary .chip{flex:none;margin-top:1px}
.qcheck summary::after{content:"+";margin-left:auto;padding-left:10px;font-family:var(--mono);color:var(--muted);font-weight:400}
.qcheck[open] summary::after{content:"−"}
.qcheck:hover{border-color:var(--line-2)}
.qcheck[open] summary{border-bottom:1px solid var(--line)}
.qcheck p{margin:0;padding:10px 11px 11px;font-size:13.5px;color:var(--ink-2);line-height:1.55;background:var(--surface-2)}

/* ---- viz-specific ---- */
.tok{display:inline-block;padding:2px 5px;margin:2px 1px;border-radius:4px;font-family:var(--mono);font-size:12px;border:1px solid var(--line-2);white-space:pre}
.matrix-wrap{overflow-x:auto}
.cmx{display:grid;grid-template-columns:auto auto auto;gap:3px;font-family:var(--mono);font-size:12px}
.cmx div{padding:8px 10px;border-radius:5px;text-align:center;background:var(--surface-2);border:1px solid var(--line)}
.cmx .hd{background:none;border:0;color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 4px}
.cmx .tp{background:var(--good-wash);border-color:var(--good);color:var(--good-ink);font-weight:600}
.cmx .fp{background:var(--warn-wash);border-color:var(--warn);color:var(--warn-ink);font-weight:600}
.cmx .fn{background:var(--crit-wash);border-color:var(--crit);color:var(--crit-ink);font-weight:600}
.metrics{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;margin-top:10px}
.metrics b{display:block;font-size:17px;color:var(--ink);font-weight:600}
.metrics span{color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.vizrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,220px);gap:16px;align-items:start;padding:12px 14px}

.srch-hit{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:11px 14px;margin-bottom:8px;cursor:pointer;display:block;width:100%;text-align:left}
.srch-hit:hover{border-color:var(--accent);background:var(--surface-2)}
.srch-hit b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.srch-hit small{color:var(--muted);font-size:12.5px}
mark{background:var(--warn-wash);color:var(--ink);padding:0 2px;border-radius:2px}
