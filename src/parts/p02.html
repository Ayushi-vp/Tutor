<script>
"use strict";
/* ============================================================
   AI Engineer Prep Console
   ------------------------------------------------------------
   One page: curriculum + drill lists + concept visualisations,
   with progress persisted to the artifact db (falls back to
   this browser only when the capability is unavailable).
   ============================================================ */

/* ---------- tiny helpers ---------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const todayKey = () => new Date().toISOString().slice(0, 10);
const uid = () => Math.random().toString(36).slice(2, 9);
const fmt = n => n >= 1e9 ? (n/1e9).toFixed(n>=1e10?0:1)+"B" : n >= 1e6 ? (n/1e6).toFixed(n>=1e7?0:1)+"M" : n >= 1e3 ? (n/1e3).toFixed(n>=1e4?0:1)+"k" : String(n);

/* ---------- theme ---------- */
const THEME_KEY = "apc.theme";
function readLS(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function writeLS(k, v){ try { localStorage.setItem(k, v); } catch(e){ /* private mode */ } }
function applyTheme(t){
  if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  const dark = t === "dark" || (t !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  const ic = $("#themeIcon"), lb = $("#themeLbl");
  if (ic) ic.textContent = t === "system" ? "◐" : dark ? "●" : "○";
  if (lb) lb.textContent = t === "system" ? "Auto" : dark ? "Dark" : "Light";
}
(function initTheme(){
  let t = readLS(THEME_KEY) || "system";
  applyTheme(t);
  document.addEventListener("click", e => {
    const b = e.target.closest("#themeBtn"); if (!b) return;
    t = t === "system" ? "light" : t === "light" ? "dark" : "system";
    writeLS(THEME_KEY, t); applyTheme(t);
    document.dispatchEvent(new CustomEvent("themechange"));
  });
})();

/* ---------- progress store ----------
   state.items : id -> "rev" | "done"      (problems, topics, Q&A, roadmap steps)
   state.notes : id -> string
   state.days  : "YYYY-MM-DD" -> count of items completed that day
   state.srs   : id -> {box:1..5, due:"YYYY-MM-DD"}
   state.logs  : array of mock-interview records
------------------------------------------------- */
const LS_KEY = "apc.progress.v1";
/* The host injects window.claude, not necessarily before this script runs. */
function waitForClaude(){
  return new Promise(res => {
    let n = 0;
    const tick = () => {
      if (window.claude && typeof window.claude.use === "function") return res(window.claude);
      if (++n > 60) return res(null);            // give up after ~3 s
      setTimeout(tick, 50);
    };
    tick();
  });
}
const Store = {
  state: { items:{}, notes:{}, days:{}, srs:{}, logs:[], v:1 },
  ref: null, ready: false, _timer: null, _writing: false, _dirty: false,

  async init(){
    // local cache first so the page is usable immediately
    try { const raw = readLS(LS_KEY); if (raw) Object.assign(this.state, JSON.parse(raw)); } catch(e){}
    try {
      const api = await waitForClaude();
      const db = api ? await Promise.race([
        api.use("db"),
        new Promise(r => setTimeout(() => r(null), 11000))
      ]) : null;
      if (!db) return this.mark("local");
      let path = "shared/progress";
      try {
        const u = await api.use("user");
        const id = u && u.id ? await u.id() : null;
        if (id) path = "data/users/" + id + "/progress";
      } catch(e){}
      this.ref = db.doc(path);
      const snap = await this.ref.get();
      if (snap.exists){
        const d = snap.data() || {};
        const local = this.state;
        // remote wins where it has data; local-only keys survive a first sync
        this.state = {
          items: Object.assign({}, local.items, d.items || {}),
          notes: Object.assign({}, local.notes, d.notes || {}),
          days:  Object.assign({}, local.days,  d.days  || {}),
          srs:   Object.assign({}, local.srs,   d.srs   || {}),
          logs:  (d.logs && d.logs.length ? d.logs : local.logs) || [],
          v: 1
        };
        this.cacheLocal();
        document.dispatchEvent(new CustomEvent("store:sync"));
      } else if (Object.keys(this.state.items).length){
        await this.flush();
      }
      this.mark("synced");
    } catch(e){ this.mark("local"); }
    this.ready = true;
  },
  mark(kind){
    const d = $("#saveDot"); if (!d) return;
    d.classList.toggle("on", kind === "synced");
    d.title = kind === "synced" ? "Progress saved to your account" : "Progress saved in this browser only";
  },
  cacheLocal(){ try { writeLS(LS_KEY, JSON.stringify(this.state)); } catch(e){} },
  save(){
    this.cacheLocal();
    if (!this.ref) return;
    this._dirty = true;
    clearTimeout(this._timer);
    this._timer = setTimeout(() => this.flush(), 900);
  },
  async flush(){
    if (!this.ref || this._writing || !this._dirty) return;
    this._writing = true; this._dirty = false;
    try { await this.ref.set(JSON.parse(JSON.stringify(this.state))); }
    catch(e){ this._dirty = true; }
    finally {
      this._writing = false;
      if (this._dirty) setTimeout(() => this.flush(), 1200);
    }
  },

  /* --- item status --- */
  get(id){ return this.state.items[id] || null; },
  set(id, status){
    const prev = this.state.items[id] || null;
    if (prev === status) return prev;
    if (status) this.state.items[id] = status; else delete this.state.items[id];
    if (status === "done" && prev !== "done"){
      const k = todayKey();
      this.state.days[k] = (this.state.days[k] || 0) + 1;
    }
    this.save();
    document.dispatchEvent(new CustomEvent("store:change", { detail:{ id, status } }));
    return status;
  },
  cycle(id, target){
    const cur = this.get(id);
    return this.set(id, cur === target ? null : target);
  },
  note(id, text){
    if (text && text.trim()) this.state.notes[id] = text.trim(); else delete this.state.notes[id];
    this.save();
  },
  countDone(ids){ let n = 0; for (const i of ids) if (this.state.items[i] === "done") n++; return n; },
  streak(){
    const d = new Date(); let n = 0;
    for (let i = 0; i < 400; i++){
      const k = new Date(d.getTime() - i * 864e5).toISOString().slice(0, 10);
      if (this.state.days[k]) n++;
      else if (i > 0) break;
    }
    return n;
  }
};
